name: Compilar APK

# Se ejecuta en cada push y también a mano desde la pestaña Actions
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El proyecto no tiene carpeta android: se genera acá, sin tocar tu código
      - name: Agregar soporte Android
        run: flutter create --platforms=android .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: clinica-turnos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
